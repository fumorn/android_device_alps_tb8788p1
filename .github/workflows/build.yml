name: Build TWRP for tb8788p1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TWRP_BRANCH: twrp-12.1
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  DEVICE_PATH: device/alps/tb8788p1
  LUNCH_TARGET: twrp_tb8788p1-eng

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 ccache lz4 libzstd-dev \
            libxml2-dev bc libssl-dev libncurses5 lzop rsync

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "twrp-ci"
          git config --global user.email "ci@localhost"
          git config --global color.ui true

      - name: Cache TWRP source
        uses: actions/cache@v4
        with:
          path: twrp-src
          key: twrp-src-${{ env.TWRP_BRANCH }}-v1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: twrp-ccache-${{ github.run_id }}
          restore-keys: |
            twrp-ccache-

      - name: Repo init and sync TWRP source
        run: |
          set -euxo pipefail
          mkdir -p twrp-src && cd twrp-src
          if [ ! -d .repo ]; then
            repo init -u "$MANIFEST_URL" -b "$TWRP_BRANCH" --depth=1
          fi
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          set -euxo pipefail
          mkdir -p "twrp-src/$DEVICE_PATH"
          cp -r . "twrp-src/$DEVICE_PATH/"
          rm -rf "twrp-src/$DEVICE_PATH/twrp-src" "twrp-src/$DEVICE_PATH/.git" || true

      - name: Build TWRP boot image
        run: |
          set -euxo pipefail
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_COMPILERCHECK=content
          export USE_CCACHE=1
          ccache -M 5G
          cd twrp-src
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          mka -j"$(nproc)" bootimage

      - name: Upload TWRP image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-tb8788p1
          path: |
            twrp-src/out/target/product/tb8788p1/boot.img
            twrp-src/out/target/product/tb8788p1/*.img
          if-no-files-found: error
